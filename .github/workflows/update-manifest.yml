name: Attach Release Manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft/prerelease tag, for example client-v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-manifest:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify protected release and attach manifest once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          CHANNEL="$(python - "$TAG" <<'PY'
          import re, sys
          match = re.fullmatch(r'client-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-rc\.[1-9]\d*)?', sys.argv[1])
          if not match:
              raise SystemExit('tag must match client-vX.Y.Z or client-vX.Y.Z-rc.N')
          print('test' if match.group(4) else 'stable')
          PY
          )"
          MANIFEST="manifest-${CHANNEL}.json"
          gh release view "$TAG" --json isDraft,isPrerelease,assets > release.json
          python - "$MANIFEST" <<'PY'
          import json
          import sys
          value = json.load(open('release.json', encoding='utf-8'))
          if not (value['isDraft'] or value['isPrerelease']):
              raise SystemExit('refusing to modify a published stable release')
          if any(asset['name'] == sys.argv[1] for asset in value['assets']):
              raise SystemExit('{} already exists; refusing to overwrite'.format(sys.argv[1]))
          PY
          mkdir manifest-input
          gh release download "$TAG" --dir manifest-input --pattern 'manifest-*.json'
          python scripts/package-client.py merge-manifests --output "$MANIFEST" manifest-input/manifest-windows.json manifest-input/manifest-linux.json
          gh release upload "$TAG" "$MANIFEST"
